<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GirlVerse 3D</title>

  <!-- Diseño -->
  <link
    rel="stylesheet"
    href="./style.css"
  >

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
    }
  }
  </script>

</head>


<body>

  <!-- =================================
       PANTALLA INICIAL
  ================================== -->

  <div id="start">

    <div class="start-card">

      <div class="logo">
        GirlVerse
      </div>

      <p>
        Tu mundo. Tu estilo. Tu historia.
      </p>

      <p>
        Explora libremente un mundo 3D,
        conoce lugares, personaliza tu vida
        y disfruta de tu propio espacio.
      </p>

      <button id="play">
        ENTRAR AL MUNDO
      </button>

    </div>

  </div>


  <!-- =================================
       HUD DEL JUEGO
  ================================== -->

  <div id="hud">

    <b>
      🌸 GirlVerse
    </b>

    <span>
      💎
      <strong id="money">
        250
      </strong>
    </span>

    <span>
      📍
      <strong id="place">
        Ciudad
      </strong>
    </span>

    <span>
      🎒 Objetos:
      <strong id="items">
        0
      </strong>
    </span>

  </div>


  <!-- =================================
       MENSAJES
  ================================== -->

  <div id="message"></div>


  <!-- =================================
       CONTROLES
  ================================== -->

  <div id="hint">

    WASD / Flechas = caminar ·
    Mouse = cámara ·
    E = interactuar ·
    B = guardar

  </div>


  <!-- =================================
       JUEGO PRINCIPAL
  ================================== -->

  <script
    type="module"
    src="./js/main.js"
  ></script>

</body>

</html>
